<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario SENA V1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>FORMULARIO SENA V1</h1>
  <p>GRACIAS POR DEJAR SUS DATOS</p>

  <form id="formularioSENA">

    <label for="nombre">Nombre</label><br>
    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required><br><br>


    <label for="correo">Correo electrónico</label><br>
    <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required><br><br>


    <label for="edad">Edad</label><br>
    <input type="number" id="edad" name="edad" placeholder="Ingresa tu edad" required><br><br>

   
    <label for="opcion">Elige una opción</label><br>
    <select id="opcion" name="opcion" required>
      <option value="">Selecciona una opción</option>
      <option value="opcion1">Opción A</option>
      <option value="opcion2">Opción B</option>
    </select><br><br>


    <p>¿Planeas comprar un carro en los próximos 5 años? </p>

    
    <label for="si">si<input type="radio" id="si" name="compra_carro" value="sí" required></label>
    <label for="no">No<input type="radio" id="no" name="compra_carro" value="no"></label>
    <label for="talvez">Tal vez<input type="radio" id="talvez" name="compra_carro" value="talvez"></label><br>


    <label for="marca">¿Cuál es tu marca de carro favorita?</label><br>
    <select id="marca" name="marca" required>
      <option value="">Selecciona una marca</option>
      <option value="toyota">Toyota</option>
      <option value="ford">Ford</option>
      <option value="bmw">BMW</option>
    </select><br><br>
 
    <p>¿Qué medio de transporte tienes? </p>


    <label for="carro">Carro<input type="radio" id="carro" name="transporte" value="carro" required></label>
    <label for="bote">Bote <input type="radio" id="bote" name="transporte" value="bote"></label>
    <label for="bicicleta">Bicicleta<input type="radio" id="bicicleta" name="transporte" value="bicicleta"></label>
    <label for="moto">Moto<input type="radio" id="moto" name="transporte" value="moto"></label>
    <label for="avion">Avión<input type="radio" id="avion" name="transporte" value="avión"></label>
    <label for="patineta">Patineta<input type="radio" id="patineta" name="transporte" value="patineta"></label>

  
    <label for="comentarios">¿Tienes comentarios o sugerencias?</label><br>
    <textarea id="comentarios" name="comentarios" placeholder="Escribe tus comentarios aquí..."></textarea><br><br>

 
    <input type="submit" value="Enviar">

  </form>

 
  <script>
    document.getElementById("formularioSENA").addEventListener("submit", function(event) {
      event.preventDefault();  
      if (this.checkValidity()) {
        alert(" ¡Datos enviados correctamente!");
        this.reset();  
      }
    });
  </script>

</body>
</html>
